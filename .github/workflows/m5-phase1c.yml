name: M5 Phase 1c derived feature acquisition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m5-phase1c.yml'
      - 'nre/m5_phase1c.py'
      - 'reports/m5-phase1c-authorization-2026-11-12.json'
permissions:
  contents: read
concurrency:
  group: m5-phase1c
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive registered development features and commit to holdout features
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python -m nre.m5_phase1c --output "${RUNNER_TEMP}/m5-phase1c"
      - uses: actions/upload-artifact@v4
        with:
          name: m5-phase1c-derived-features
          path: |
            ${{ runner.temp }}/m5-phase1c/development.json
            ${{ runner.temp }}/m5-phase1c/summary.json
          if-no-files-found: error
          retention-days: 30
