name: NRE M1 SEC Historical Index Probe

on:
  push:
    paths:
      - '.github/workflows/sec-index-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe historical SEC-index mirror filter
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://datasets-server.huggingface.co/filter"
          where = (
              '"form_type"=\'8-K\' AND '
              '"date_filed">=\'2026-01-05\' AND '
              '"date_filed"<=\'2026-03-31\''
          )
          params = {
              "dataset": "DenyTranDFW/SEC_Master_Index_Files_Lists",
              "config": "default",
              "split": "train",
              "where": where,
              "orderby": '"date_filed", "cik"',
              "offset": 0,
              "length": 5,
          }
          url = base + "?" + urllib.parse.urlencode(params)
          with urllib.request.urlopen(url, timeout=60) as response:
              body = response.read()
          doc = json.loads(body)
          rows = [x["row"] for x in doc.get("rows", [])]
          print(json.dumps({
              "url": url,
              "keys": sorted(doc),
              "num_rows_total": doc.get("num_rows_total"),
              "rows_returned": len(rows),
              "sample": rows,
          }, sort_keys=True))
          assert rows
          assert all(r["form_type"] == "8-K" for r in rows)
          assert all("sec.gov/Archives/edgar/full-index/2026/QTR1/master.idx" in r["src"] for r in rows)
          PY
