name: NRE M1 SEC Historical Index Probe

on:
  push:
    paths:
      - '.github/workflows/sec-index-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe SEC historical directory and EFTS JSON
        env:
          SEC_USER_AGENT: NRE-M1 research contact https://github.com/Fahad9101/NRE
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tempfile
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from nre.ingestion import SecRelayClient

          root = Path(tempfile.mkdtemp(prefix="nre-index-probe-"))
          client = SecRelayClient(os.environ["SEC_USER_AGENT"])
          directory_url = "https://www.sec.gov/Archives/edgar/daily-index/2026/QTR1/"
          directory, dmeta = client.fetch(directory_url, root)
          dtext = directory.decode("utf-8", errors="strict")
          names = sorted(set(re.findall(r"master\.(2026\d{4})\.idx", dtext)))
          print(json.dumps({
              "directory_source": directory_url,
              "daily_master_files_found": len(names),
              "first_master": names[0] if names else None,
              "last_master": names[-1] if names else None,
          }, sort_keys=True))
          assert len(names) >= 60 and "20260105" in names and "20260331" in names

          queries = [
              {"dateRange":"custom","startdt":"2026-01-05","enddt":"2026-01-05","forms":"8-K","from":"0","size":"100"},
              {"q":"Item 2.02","dateRange":"custom","startdt":"2026-01-05","enddt":"2026-03-31","forms":"8-K","from":"0","size":"100"},
              {"q":"*","dateRange":"custom","startdt":"2026-01-05","enddt":"2026-01-05","forms":"8-K","from":"0","size":"100"},
          ]
          for params in queries:
              url = "https://efts.sec.gov/LATEST/search-index?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "User-Agent": os.environ["SEC_USER_AGENT"],
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                  doc = json.loads(body)
                  hits = doc.get("hits", {})
                  total = hits.get("total")
                  sample = hits.get("hits", [])[:2]
                  print(json.dumps({
                      "efts_url": url,
                      "status": 200,
                      "total": total,
                      "sample": sample,
                  }, sort_keys=True))
              except Exception as exc:
                  print(json.dumps({
                      "efts_url": url,
                      "error": type(exc).__name__,
                      "message": str(exc),
                  }, sort_keys=True))
          PY
