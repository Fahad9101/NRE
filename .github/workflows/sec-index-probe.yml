name: NRE M1 SEC Historical Index Probe

on:
  push:
    paths:
      - '.github/workflows/sec-index-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover SEC-index mirror parquet files
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          dataset = "DenyTranDFW/SEC_Master_Index_Files_Lists"
          url = "https://datasets-server.huggingface.co/parquet?" + urllib.parse.urlencode({"dataset": dataset})
          with urllib.request.urlopen(url, timeout=60) as response:
              doc = json.loads(response.read())
          files = doc.get("parquet_files", [])
          print(json.dumps({
              "parquet_file_count": len(files),
              "sample": files[:5],
          }, sort_keys=True))
          assert files
          assert all(x.get("config") == "default" and x.get("split") == "train" for x in files)
          PY
