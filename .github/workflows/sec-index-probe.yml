name: NRE M1 SEC Historical Index Probe

on:
  push:
    paths:
      - '.github/workflows/sec-index-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe historical SEC-index mirror schema and filters
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          dataset = "DenyTranDFW/SEC_Master_Index_Files_Lists"
          base = "https://datasets-server.huggingface.co"

          def get(endpoint, params):
              url = base + endpoint + "?" + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      body = response.read()
                  doc = json.loads(body)
                  print(json.dumps({
                      "endpoint": endpoint,
                      "params": params,
                      "status": 200,
                      "keys": sorted(doc),
                      "features": doc.get("features"),
                      "num_rows_total": doc.get("num_rows_total"),
                      "rows": [x.get("row") for x in doc.get("rows", [])[:3]],
                  }, sort_keys=True))
                  return doc
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(json.dumps({
                      "endpoint": endpoint,
                      "params": params,
                      "status": exc.code,
                      "error_body": body[:1000],
                  }, sort_keys=True))
                  return None

          first = get("/first-rows", {
              "dataset": dataset, "config": "default", "split": "train"
          })
          assert first

          predicates = [
              '"form_type"=\'8-K\'',
              '"form_type"=\'8-K\' AND "qtr"=\'QTR1\'',
              '"form_type"=\'8-K\' AND "qtr"=\'QTR1\' AND "yr"=\'2026\'',
              '"form_type"=\'8-K\' AND "qtr"=\'QTR1\' AND "yr"=\'2026-01-01\'',
              '"form_type"=\'8-K\' AND "date_filed">=DATE \'2026-01-05\' AND "date_filed"<=DATE \'2026-03-31\'',
          ]
          successes = []
          for where in predicates:
              doc = get("/filter", {
                  "dataset": dataset,
                  "config": "default",
                  "split": "train",
                  "where": where,
                  "offset": 0,
                  "length": 5,
              })
              if doc and doc.get("rows"):
                  successes.append(where)

          print(json.dumps({"successful_predicates": successes}, sort_keys=True))
          assert successes
          PY
