name: Alpaca historical access check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpaca-access.yml'
      - 'nre/alpaca_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical SIP access and pagination
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python -m nre.alpaca_probe
