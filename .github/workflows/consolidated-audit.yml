name: Consolidated cohort audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidated-audit.yml'
      - 'nre/consolidated_audit.py'
      - 'nre/acceptance.py'
      - 'config/pilot.json'
      - 'reports/m1-reviewed-candidate-ledger.json'
      - 'reports/m1-acceptance-review.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refetch accepted events' prices and run the formal cohort audit
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python -m nre.consolidated_audit
