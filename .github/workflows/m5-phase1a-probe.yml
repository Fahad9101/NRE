name: M5 Phase 1a availability probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m5-phase1a-probe.yml'
      - 'config/m5-phase1a-probe-spec.json'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Alpaca availability (metadata only)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python -m nre.m5_phase1a_probe
