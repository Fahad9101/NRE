name: TEMPORARY diagnostic - bulk SEC data reachability
# Not a permanent workflow. Checks only whether GitHub Actions' own infrastructure can reach SEC's
# bulk Financial Statement Data Sets download (www.sec.gov/files/dera/data/financial-statement-data-sets/),
# since data.sec.gov/api/xbrl/companyconcept/ was confirmed blocked from GH Actions on 2026-09-30
# (reports/m3-earnings-surprise-workflow-result-2026-09-30.json). To be deleted once answered either way.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: HEAD request only, no download
        run: |
          curl -sS -I -A "NRE research contact https://github.com/Fahad9101/NRE" \
            "https://www.sec.gov/files/dera/data/financial-statement-data-sets/2025q4.zip" \
            -o /dev/null -w "HTTP_STATUS:%{http_code}\n" || echo "CURL_FAILED:$?"
